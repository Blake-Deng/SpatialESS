name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("Rcpp", "Matrix", "testthat", "lme4"))'
          R CMD INSTALL vendor/SpatialESS
          R CMD INSTALL .

      - name: Test H5AD bridge
        run: python -m unittest discover -s tests/python -v

      - name: Test R packages
        run: |
          Rscript -e 'testthat::test_local("vendor/SpatialESS")'
          Rscript -e 'testthat::test_local(".")'

      - name: Run minimal example
        run: ./examples/minimal/run_demo.sh

      - name: Check integration package
        run: |
          R CMD build .
          R CMD check --no-manual SpatialESSSPARKLE_0.1.1.tar.gz
