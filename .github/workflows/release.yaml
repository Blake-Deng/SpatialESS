name: Release SpatialESS SPARKLE

on:
  push:
    tags:
      - "sparkle-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Validate bundled versions and tag
        id: metadata
        run: Rscript .github/scripts/release.R sparkle --validate-only
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: vendor/SpatialESS
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::lme4
            any::data.table
            any::future.apply
            any::RANN
          needs: check
      - name: Build engine and bridge, install private engine, and check both
        env:
          RELEASE_ASSET_DIR: ${{ runner.temp }}/spatialess-release-assets
        run: Rscript .github/scripts/release.R sparkle
      - name: Publish checked engine and bridge
        uses: softprops/action-gh-release@v2
        with:
          name: SpatialESS SPARKLE ${{ github.ref_name }}
          body_path: NEWS.md
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/spatialess-release-assets/SpatialESS_*.tar.gz
            ${{ runner.temp }}/spatialess-release-assets/SpatialESSSPARKLE_*.tar.gz
